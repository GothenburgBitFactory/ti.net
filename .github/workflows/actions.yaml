name: Update Tools
on:
  schedule:
    - cron: 0 2 * * *
jobs:
  update-tools:
    if: ${{ github.repository_owner == 'GothenburgBitFactory' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Update tools
        env:
          GITHUB_API_KEY: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install --upgrade pip
          /tmp/venv/bin/pip install -r bin/requirements.txt
          /tmp/venv/bin/python bin/update.py static/tools-data.json
      - name: Commit and push changes
        run: |
          git config user.name "Timewarrior Tools Bot"
          git config user.email "timew-tools-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Updated tools-data.json"
          git push origin HEAD:main
